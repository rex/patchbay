name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans every commit, not just the tip

      - uses: astral-sh/setup-uv@v6 # make test reads VIBE.yaml with PyYAML via uv

      - name: Toolchain
        run: swift --version

      - name: Lint
        run: make lint

      - name: Compile
        run: make typecheck

      - name: Test
        run: make test

      - name: Secret scan (full history)
        run: |
          brew install gitleaks
          gitleaks git --no-banner --redact --config .gitleaks.toml .
